  <style>
    :root{
      --paper:#fdf4e9;
      --card:#fffbf3;
      --ink:#1b2419;
      --muted:#5b5646;
      --rust:#e0201b;
      --olive:#04613a;
      --green:#0b8f48;
      --gold:#f2b705;
      --line:#dccdb0;
      --soft:#f7efe0;
      --shadow:0 16px 34px rgba(27,36,25,.12);
    }
    body.dark{
      --paper:#0e150f;
      --card:#161f17;
      --ink:#f7f1e3;
      --muted:#c9c2ac;
      --rust:#ff6b58;
      --olive:#4fd18d;
      --green:#22c55e;
      --gold:#facc15;
      --line:#3a4536;
      --soft:#182235;
      --shadow:0 18px 44px rgba(0,0,0,.32);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{background:var(--paper);color:var(--ink);font-family:'Manrope',Segoe UI,Arial,sans-serif;line-height:1.6;transition:background .2s,color .2s;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
    h1,h2,h3,.brand,.cover .subject,.folder-title,.portal-head strong{font-family:'Fraunces',Georgia,serif;letter-spacing:-.01em}
    a{text-decoration:none;color:inherit}
    .container{width:min(1160px,92%);margin:auto}
    .top-strip{background:#111827;border-bottom:1px solid #020617;color:#fff7cc;overflow:hidden;padding:9px 0;font-weight:900}
    .ticker{display:flex;width:max-content;gap:48px;white-space:nowrap;animation:ticker 46s linear infinite}
    @keyframes ticker{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
    header{position:sticky;top:0;z-index:80;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}
    body.dark header{background:rgba(18,26,43,.94)}
    .nav{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0}
    .brand{display:flex;align-items:center;gap:12px;font-weight:950;line-height:1.1}
    .brand-text{color:var(--rust)}
    .brand-text .pen-word{display:inline-block;opacity:0;transform:translateY(6px);animation:penWrite .45s ease forwards}
    .brand-text .pen-word::after{content:"";position:absolute;left:0;bottom:-3px;height:2px;width:0;background:currentColor;opacity:.65;animation:penUnderline .45s ease forwards;animation-delay:inherit}
    .brand-text .pen-word{position:relative}
    @keyframes penWrite{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    @keyframes penUnderline{0%{width:0}70%{width:100%}100%{width:0;opacity:0}}
    .logo-mark{width:50px;height:50px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;display:grid;place-items:center;flex:0 0 auto}
    .logo-mark img{width:100%;height:100%;object-fit:cover;display:block}
    .brand small{display:block;color:var(--rust);font-size:12px;letter-spacing:1.6px;text-transform:uppercase;margin-top:4px}
    .menu{display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:thin}
    .menu a,.theme-toggle{flex:0 0 auto;padding:9px 12px;border:1px solid transparent;border-radius:8px;font-weight:850;font-size:14px;color:var(--ink);background:transparent;cursor:pointer;font-family:inherit}
    .menu a:hover,.theme-toggle:hover{background:rgba(11,143,72,.12);border-color:var(--line)}
    .youtube-link{display:inline-flex!important;align-items:center;gap:8px}
    .youtube-link svg{width:20px;height:20px;fill:#ff0000}
    .all-tabs{position:fixed;right:12px;top:122px;z-index:120;width:174px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:8px}
    .all-tabs-toggle{width:100%;border:0;background:linear-gradient(135deg,var(--green),var(--olive));color:#fff;border-radius:6px;padding:10px;font-weight:950;cursor:pointer}
    .all-tabs .tab-list{display:none;gap:6px;max-height:calc(100vh - 220px);overflow-y:auto;margin-top:8px}
    .all-tabs.open .tab-list{display:grid}
    .all-tabs a{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:8px 9px;font-size:12px;font-weight:850}
    section{padding:64px 0}
    .hero{padding:58px 0 46px;border-bottom:1px solid var(--line)}
    .hero-grid{display:grid;grid-template-columns:1fr;max-width:760px;margin:0 auto;text-align:center;gap:28px;align-items:center}
    .hero .actions{justify-content:center}
    .hero-badges{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
    .eyebrow,.pill{display:inline-block;background:rgba(11,143,72,.12);border:1px solid var(--line);color:var(--olive);border-radius:999px;padding:6px 10px;font-weight:900;font-size:12px}
    .pill-free{background:#0b8f48;border-color:#0b8f48;color:#fff}
    .eyebrow.msu{background:rgba(224,32,27,.12);color:var(--rust)}
    h1{font-size:clamp(34px,5vw,58px);line-height:1.08;margin:16px 0;letter-spacing:0}
    .hero p,.section-head p,.card p{color:var(--muted)}
    .type-cursor{display:inline-block;margin-left:2px;color:var(--rust);animation:typeBlink .9s step-end infinite}
    @keyframes typeBlink{0%,100%{opacity:1}50%{opacity:0}}
    .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:11px 18px;border-radius:8px;font-weight:900;border:1px solid var(--ink);cursor:pointer}
    .btn-primary{background:var(--ink);color:var(--card)}
    .btn-soft{background:var(--soft);border-color:var(--line);color:var(--ink)}
    .portal-panel,.card,.catalog-card{background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
    .portal-panel{padding:22px}
    .portal-menu{display:grid;gap:12px}
    .portal-link,.portal-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-weight:900}
    .portal-link span:first-child,.portal-row span:first-child{display:flex;align-items:center;gap:12px}
    .portal-ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:950}
    .home-ico{background:var(--olive)}.student-ico{background:var(--green)}.partner-ico{background:var(--gold)}.moon-ico{background:var(--rust)}
    .student-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:-4px}
    .student-actions a{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;font-weight:900}
    .switch{width:46px;height:26px;border-radius:999px;background:#cbd5e1;position:relative;border:1px solid var(--line)}
    .switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:.2s}
    body.dark .switch{background:var(--green)}
    body.dark .switch::after{left:23px}
    .portal-head{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:16px}
    .portal-head img{width:76px;height:76px;border-radius:8px;object-fit:cover;background:#fff;border:1px solid var(--line)}
    .portal-head strong{font-size:22px;display:block}
    .progress-list{display:grid;gap:12px}
    .progress-item{background:rgba(255,255,255,.35);border:1px solid var(--line);border-radius:8px;padding:14px}
    .progress-row{display:flex;justify-content:space-between;gap:14px;font-weight:900;margin-bottom:8px}
    .bar{height:8px;background:rgba(103,95,81,.18);border-radius:999px;overflow:hidden}
    .bar span{display:block;height:100%;background:var(--green);border-radius:999px}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:28px}
    .stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:17px;text-align:center}
    .stat strong{display:block;font-size:25px;color:var(--rust)}
    .stat span{font-size:13px;color:var(--muted);font-weight:800}
    .section-head{text-align:center;margin:0 auto 32px;max-width:780px}
    .section-head h2{font-size:clamp(28px,4vw,42px);line-height:1.15;margin-bottom:8px}
    .filters{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
    .filter-chip{border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:850;color:var(--muted);cursor:pointer;background:none;user-select:none}
    .filter-chip.active{background:var(--ink);color:var(--card);border-color:var(--ink)}
    .more-playlists{display:flex;align-items:center;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
    .more-playlists-label{font-size:13px;font-weight:850;color:var(--muted)}
    .more-playlists .filter-chip{text-decoration:none;display:inline-block}
    .featured{background:linear-gradient(180deg,var(--soft),var(--paper));overflow:hidden}
    .featured-rail{display:flex;align-items:center;justify-content:center;gap:18px;min-height:270px}
    .featured-card{width:260px;min-height:210px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center;box-shadow:var(--shadow);opacity:.42;transform:scale(.84)}
    .featured-card.active{opacity:1;transform:scale(1.1);border:2px solid #91a8d8}
    .featured-logo{height:72px;border-radius:14px;background:var(--soft);display:grid;place-items:center;margin-bottom:20px;color:var(--muted);font-weight:900}
    .featured-card h3{font-size:20px;line-height:1.25;margin-bottom:18px}
    .dots{display:flex;justify-content:center;gap:9px;margin-top:16px}
    .dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
    .dot.active{width:24px;background:var(--rust)}
    .catalog-grid{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 4px 14px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .catalog-grid::-webkit-scrollbar{display:none}
    .catalog-card{overflow:hidden;display:flex;flex-direction:column;flex:0 0 250px;scroll-snap-align:start}
    .cover{min-height:178px;color:#fff;padding:16px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(155deg,#0b8f48,#04361f)}
    .catalog-card:nth-child(2n) .cover{background:linear-gradient(155deg,#e0201b,#5c0f0c)}
    .catalog-card:nth-child(3n) .cover{background:linear-gradient(155deg,#04613a,#0a2a1a)}
    .cover .code{font-size:12px;font-weight:900;letter-spacing:1px;opacity:.86}
    .cover .subject{font-size:24px;font-weight:950;line-height:1.15}
    .cover .subject a,.subject-link{color:inherit;text-decoration:none}
    .cover .subject a:hover,.subject-link:hover{text-decoration:underline}
    .cover .faculty{font-size:13px;opacity:.82}
    .info{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
    .info h3{font-size:19px;line-height:1.25}
    .price{font-size:19px;font-weight:950;color:var(--rust);margin-top:auto;text-decoration:none;display:block}
    .price:hover{text-decoration:underline}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:18px}
    .card{padding:22px}
    .card h3{font-size:21px;margin-bottom:8px}
    .icon,.avatar{width:50px;height:50px;background:rgba(11,143,72,.12);border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;font-weight:950;color:var(--olive);margin-bottom:14px}
    .avatar{background:var(--ink);color:var(--card);font-size:18px}
    .course-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .folder-panel{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
    .folder-title{padding:18px 22px;border-bottom:1px solid var(--line);font-weight:950;color:var(--rust);display:flex;align-items:center;gap:10px}
    .drive-badge{font-family:'Manrope',sans-serif;font-size:11px;font-weight:800;letter-spacing:.02em;color:var(--green);background:rgba(11,143,90,.12);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
    .folder-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:20px}
    .folder-card{display:flex;align-items:center;gap:12px;background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:15px;font-weight:900;min-height:58px;transition:border-color .15s,transform .15s}
    .folder-card:hover{border-color:var(--green);transform:translateY(-2px)}
    .folder-card small{display:block;color:var(--muted);font-weight:700;margin-top:2px}
    .folder-icon{width:18px;height:14px;border:1.5px solid #111;background:#ffc928;border-radius:2px;position:relative;flex:0 0 auto}
    .folder-icon::before{content:"";position:absolute;left:1px;top:-5px;width:9px;height:5px;background:#ffc928;border:1.5px solid #111;border-bottom:0;border-radius:2px 2px 0 0}
    .notice-board{background:var(--ink);color:var(--card);border-radius:8px;padding:26px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .notice-board p{color:#e8dfcf}
    .updates{display:grid;gap:10px}
    .update{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:13px}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
    form{display:grid;gap:12px}
    input,select,textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--card);color:var(--ink)}
    .telegram-box{background:rgba(34,158,217,.12);border:1px solid #7abadd;border-radius:8px;padding:26px;display:flex;justify-content:space-between;gap:18px;align-items:center}
    footer{background:var(--ink);color:#e8dfcf;padding:34px 0;margin-top:20px}
    .footer{display:grid;grid-template-columns:1.2fr repeat(3,1fr);gap:22px}
    footer h3{color:var(--card);margin-bottom:10px}
    footer a,footer p{display:block;color:#e8dfcf;margin:6px 0}
    .footer-quicklinks{border-top:1px solid rgba(232,223,207,.18);border-bottom:1px solid rgba(232,223,207,.18);overflow:hidden;padding:14px 0;margin-top:26px}
    .footer-ticker{display:flex;width:max-content;gap:40px;white-space:nowrap;animation:ticker 28s linear infinite}
    .quick-link{display:inline-flex;align-items:center;gap:8px;color:#e8dfcf;font-weight:700;margin:0}
    .quick-link svg{width:16px;height:16px;flex:0 0 auto;stroke:var(--gold)}
    .footer-bottom{text-align:center;padding-top:18px;margin-top:18px;border-top:1px solid rgba(232,223,207,.18);color:#c9c2ac;font-size:14px}
    @media(max-width:900px){.hero-grid,.two-col,.notice-board,.footer{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.nav{align-items:flex-start}.menu{width:100%}.all-tabs{right:8px;top:112px;width:150px}.folder-grid{grid-template-columns:repeat(2,1fr)}.featured-card{display:none}.featured-card.active{display:block;transform:scale(1)}}
    @media(max-width:560px){section{padding:46px 0}.stats,.folder-grid,.student-actions{grid-template-columns:1fr}.brand{font-size:15px}.logo-mark{width:42px;height:42px}.all-tabs{top:auto;bottom:82px;width:138px}.top-strip{font-size:14px}}
  </style>
</head>

    .portal-panel{padding:22px}
    .portal-menu{display:grid;gap:12px}
    .portal-link,.portal-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-weight:900}
    .portal-link span:first-child,.portal-row span:first-child{display:flex;align-items:center;gap:12px}
    .portal-ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:950}
    .home-ico{background:var(--olive)}.student-ico{background:var(--green)}.partner-ico{background:var(--gold)}.moon-ico{background:var(--rust)}
    .student-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:-4px}
    .student-actions a{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;font-weight:900}
    .switch{width:46px;height:26px;border-radius:999px;background:#cbd5e1;position:relative;border:1px solid var(--line)}
    .switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:.2s}
    body.dark .switch{background:var(--green)}
    body.dark .switch::after{left:23px}
    .portal-head{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:16px}
    .portal-head img{width:76px;height:76px;border-radius:8px;object-fit:cover;background:#fff;border:1px solid var(--line)}
    .portal-head strong{font-size:22px;display:block}
    .progress-list{display:grid;gap:12px}
    .progress-item{background:rgba(255,255,255,.35);border:1px solid var(--line);border-radius:8px;padding:14px}
    .progress-row{display:flex;justify-content:space-between;gap:14px;font-weight:900;margin-bottom:8px}
    .bar{height:8px;background:rgba(103,95,81,.18);border-radius:999px;overflow:hidden}
    .bar span{display:block;height:100%;background:var(--green);border-radius:999px}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:28px}
    .stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:17px;text-align:center}
    .stat strong{display:block;font-size:25px;color:var(--rust)}
    .stat span{font-size:13px;color:var(--muted);font-weight:800}
    .section-head{text-align:center;margin:0 auto 32px;max-width:780px}
    .section-head h2{font-size:clamp(28px,4vw,42px);line-height:1.15;margin-bottom:8px}
    .filters{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
    .filter-chip{border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:850;color:var(--muted);cursor:pointer;background:none;user-select:none}
    .filter-chip.active{background:var(--ink);color:var(--card);border-color:var(--ink)}
    .more-playlists{display:flex;align-items:center;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
    .more-playlists-label{font-size:13px;font-weight:850;color:var(--muted)}
    .more-playlists .filter-chip{text-decoration:none;display:inline-block}
    .featured{background:linear-gradient(180deg,var(--soft),var(--paper));overflow:hidden}
    .featured-rail{display:flex;align-items:center;justify-content:center;gap:18px;min-height:270px}
    .featured-card{width:260px;min-height:210px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center;box-shadow:var(--shadow);opacity:.42;transform:scale(.84)}
    .featured-card.active{opacity:1;transform:scale(1.1);border:2px solid #91a8d8}
    .featured-logo{height:72px;border-radius:14px;background:var(--soft);display:grid;place-items:center;margin-bottom:20px;color:var(--muted);font-weight:900}
    .featured-card h3{font-size:20px;line-height:1.25;margin-bottom:18px}
    .dots{display:flex;justify-content:center;gap:9px;margin-top:16px}
    .dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
    .dot.active{width:24px;background:var(--rust)}
    .catalog-grid{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 4px 14px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .catalog-grid::-webkit-scrollbar{display:none}
    .catalog-card{overflow:hidden;display:flex;flex-direction:column;flex:0 0 250px;scroll-snap-align:start}
    .cover{min-height:178px;color:#fff;padding:16px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(155deg,#0b8f48,#04361f)}
    .catalog-card:nth-child(2n) .cover{background:linear-gradient(155deg,#e0201b,#5c0f0c)}
    .catalog-card:nth-child(3n) .cover{background:linear-gradient(155deg,#04613a,#0a2a1a)}
    .cover .code{font-size:12px;font-weight:900;letter-spacing:1px;opacity:.86}
    .cover .subject{font-size:24px;font-weight:950;line-height:1.15}
    .cover .subject a,.subject-link{color:inherit;text-decoration:none}
    .cover .subject a:hover,.subject-link:hover{text-decoration:underline}
    .cover .faculty{font-size:13px;opacity:.82}
    .info{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
    .info h3{font-size:19px;line-height:1.25}
    .price{font-size:19px;font-weight:950;color:var(--rust);margin-top:auto;text-decoration:none;display:block}
    .price:hover{text-decoration:underline}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:18px}
    .card{padding:22px}
    .card h3{font-size:21px;margin-bottom:8px}
    .icon,.avatar{width:50px;height:50px;background:rgba(11,143,72,.12);border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;font-weight:950;color:var(--olive);margin-bottom:14px}
    .avatar{background:var(--ink);color:var(--card);font-size:18px}
    .course-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .folder-panel{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
    .folder-title{padding:18px 22px;border-bottom:1px solid var(--line);font-weight:950;color:var(--rust);display:flex;align-items:center;gap:10px}
    .drive-badge{font-family:'Manrope',sans-serif;font-size:11px;font-weight:800;letter-spacing:.02em;color:var(--green);background:rgba(11,143,90,.12);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
    .folder-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:20px}
    .folder-card{display:flex;align-items:center;gap:12px;background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:15px;font-weight:900;min-height:58px;transition:border-color .15s,transform .15s}
    .folder-card:hover{border-color:var(--green);transform:translateY(-2px)}
    .folder-card small{display:block;color:var(--muted);font-weight:700;margin-top:2px}
    .folder-icon{width:18px;height:14px;border:1.5px solid #111;background:#ffc928;border-radius:2px;position:relative;flex:0 0 auto}
    .folder-icon::before{content:"";position:absolute;left:1px;top:-5px;width:9px;height:5px;background:#ffc928;border:1.5px solid #111;border-bottom:0;border-radius:2px 2px 0 0}
    .notice-board{background:var(--ink);color:var(--card);border-radius:8px;padding:26px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .notice-board p{color:#e8dfcf}
    .updates{display:grid;gap:10px}
    .update{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:13px}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
    form{display:grid;gap:12px}
    input,select,textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--card);color:var(--ink)}
    .telegram-box{background:rgba(34,158,217,.12);border:1px solid #7abadd;border-radius:8px;padding:26px;display:flex;justify-content:space-between;gap:18px;align-items:center}
    footer{background:var(--ink);color:#e8dfcf;padding:34px 0;margin-top:20px}
    .footer{display:grid;grid-template-columns:1.2fr repeat(3,1fr);gap:22px}
    footer h3{color:var(--card);margin-bottom:10px}
    footer a,footer p{display:block;color:#e8dfcf;margin:6px 0}
    .footer-quicklinks{border-top:1px solid rgba(232,223,207,.18);border-bottom:1px solid rgba(232,223,207,.18);overflow:hidden;padding:14px 0;margin-top:26px}
    .footer-ticker{display:flex;width:max-content;gap:40px;white-space:nowrap;animation:ticker 28s linear infinite}
    .quick-link{display:inline-flex;align-items:center;gap:8px;color:#e8dfcf;font-weight:700;margin:0}
    .quick-link svg{width:16px;height:16px;flex:0 0 auto;stroke:var(--gold)}
    .footer-bottom{text-align:center;padding-top:18px;margin-top:18px;border-top:1px solid rgba(232,223,207,.18);color:#c9c2ac;font-size:14px}
    @media(max-width:900px){.hero-grid,.two-col,.notice-board,.footer{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.nav{align-items:flex-start}.menu{width:100%}.all-tabs{right:8px;top:112px;width:150px}.folder-grid{grid-template-columns:repeat(2,1fr)}.featured-card{display:none}.featured-card.active{display:block;transform:scale(1)}}
    @media(max-width:560px){section{padding:46px 0}.stats,.folder-grid,.student-actions{grid-template-columns:1fr}.brand{font-size:15px}.logo-mark{width:42px;height:42px}.all-tabs{top:auto;bottom:82px;width:138px}.top-strip{font-size:14px}}
  </style>
